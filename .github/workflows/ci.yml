name: Firmware CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [esp32c3]
    container:
      image: espressif/idf:release-v6.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c3
          idf.py build
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: bitle-esp32c3
          path: build/*.bin
          if-no-files-found: warn